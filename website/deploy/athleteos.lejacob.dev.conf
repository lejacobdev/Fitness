# AthleteOS website (github.com/lejacobdev/Fitness, website/), static files
# deployed by website/deploy.sh. /fitness is the same backend as
# api.lejacob.dev/fitness, so the coach dashboard is same-origin here.
<VirtualHost *:80>
    ServerName athleteos.lejacob.dev
    Redirect permanent / https://athleteos.lejacob.dev/
</VirtualHost>

<VirtualHost *:443>
    ServerName athleteos.lejacob.dev
    DocumentRoot /var/www/athleteos

    <Location "/">
        <RequireAny>
            Include /etc/apache2/cloudflare-ips.conf
            Require ip 127.0.0.1
        </RequireAny>
    </Location>

    SSLEngine On
    SSLCertificateFile /etc/cloudflare/origindev.pem
    SSLCertificateKeyFile /etc/cloudflare/origindev.key
    SSLCertificateChainFile /etc/cloudflare/origin_ca_rsa_root.pem

    <Directory /var/www/athleteos>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectorySlash On
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    <Location "/fitness">
        ProxyPass "http://127.0.0.1:8421"
        ProxyPassReverse "http://127.0.0.1:8421"
    </Location>

    RedirectMatch 302 ^/coach/?$ /fitness/dashboard/
    RedirectMatch 302 ^/dashboard/?$ /fitness/dashboard/

    ErrorDocument 404 /404.html

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000"
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/athleteos_error.log
    CustomLog ${APACHE_LOG_DIR}/athleteos_access.log combined
</VirtualHost>
