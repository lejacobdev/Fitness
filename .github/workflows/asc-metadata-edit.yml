name: asc-metadata-edit

# Reads the live listing texts, review notes and age-rating answers (always),
# and — when a file is given — writes the ones in that JSON file
# (tools/metadata/*.json). Dispatch-only.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'App bundle identifier'
        required: false
        default: 'com.studentathlete.app'
      file:
        description: 'JSON file to apply (empty: only read)'
        required: false
        default: ''

jobs:
  metadata:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply
        if: inputs.file != ''
        run: node tools/asc.mjs metadata-set '${{ inputs.bundle_id }}' '${{ inputs.file }}'
      - name: Current
        run: node tools/asc.mjs metadata-get '${{ inputs.bundle_id }}'
