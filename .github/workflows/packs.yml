name: packs

# §19: ubuntu-latest — regenerating content packs is pure data work and never
# needs a Swift compiler. §3: packs are versioned and served over HTTPS with an
# ETag, so the checksum in the manifest is the thing that must be trustworthy.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the packs to a GitHub release (otherwise artifact only)'
        type: boolean
        required: false
        default: false
      tag:
        description: 'Release tag to publish under, e.g. packs-2026.09.22'
        required: false
        default: ''
  push:
    paths:
      - 'content/**'
      - '.github/workflows/packs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard — content pipeline exists
        id: guard
        run: |
          if [ -f content/package.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'content/ has no package.json yet — M1 has not landed.'
          fi

      - name: Install
        if: steps.guard.outputs.present == 'true'
        working-directory: content
        run: npm ci

      - name: Catalogue integrity tests (§21 — these block the build)
        if: steps.guard.outputs.present == 'true'
        working-directory: content
        run: npm test

      - name: Build packs
        if: steps.guard.outputs.present == 'true'
        working-directory: content
        run: npm run build

      - name: Verify checksums against the manifest
        if: steps.guard.outputs.present == 'true'
        working-directory: content
        run: |
          set -euo pipefail
          node scripts/verify-packs.mjs dist
          echo '### Packs' >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '| pack | version | bytes | sha256 |'
            echo '|---|---|---|---|'
            node -e '
              const m = require("./dist/manifest.json");
              for (const p of m.packs) {
                console.log(`| ${p.slug} | ${p.version} | ${p.sizeBytes} | \`${p.checksum.slice(0,16)}…\` |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.present == 'true'
        with:
          name: content-packs
          path: content/dist/
          if-no-files-found: error

      - name: Publish to a release
        if: steps.guard.outputs.present == 'true' && inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="packs-$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$tag" \
            --title "Content packs $tag" \
            --notes "Generated by \`packs.yml\` run ${{ github.run_number }} from ${{ github.sha }}. Checksums verified against dist/manifest.json." \
            content/dist/*
          echo "published $tag" >> "$GITHUB_STEP_SUMMARY"
