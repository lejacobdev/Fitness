name: testflight

# §19: archive, export, upload, then PRINT THE EVIDENCE. A green upload that
# silently dropped the HealthKit or App Groups entitlement looks identical to a
# correct one until a reviewer opens the app, so this workflow ends by dumping
# the signed entitlements of the app and every nested bundle.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What is in this build (goes in the run summary)'
        required: false
        default: 'M0 pipeline proof — placeholder screen'
  # A safety net independent of any particular Claude Code session: whatever
  # is on master gets a real signed build uploaded once a day regardless of
  # whether anyone dispatches this manually. 06:00 UTC, after the previous
  # day's work has had a chance to land.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
  BUILD_NUMBER: ${{ github.run_number }}
  BUNDLE_ID: com.studentathlete.app

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets are present
        env:
          P12: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::missing $name"; missing=1; fi
          done
          [ $missing -eq 0 ] || {
            echo 'See docs/SIGNING.md for how to produce each of these without a Mac.'
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate content
        run: |
          if [ -f content/package.json ]; then
            cd content && npm ci && npm run build
          else
            echo "content/ not present yet — M1 has not landed."
          fi

      - name: XcodeGen
        working-directory: app
        run: xcodegen generate --spec project.yml

      # §19: import ONE distribution certificate from a secret. Never let Xcode
      # request a new one per run — every runner starts with an empty keychain,
      # and the account's 15-certificate ceiling stops builds dead once hit.
      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral: the keychain dies with the runner.
          keychain_password="$(openssl rand -base64 24)"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          # Both -T flags are required. With only one, signing later raises a
          # prompt that nothing can answer and the job hangs until timeout (§19).
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$keychain" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # And this, or the -T grants are not actually honoured (§19).
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"

          rm -f "$RUNNER_TEMP/dist.p12"

          echo '--- identities available for signing ---'
          security find-identity -v -p codesigning "$keychain"

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Manual signing: automatic signing (-allowProvisioningUpdates) minted a
      # brand-new development certificate on every fresh CI runner until the
      # team hit Apple's certificate limit and archives failed. Release now
      # signs with the imported distribution certificate and these profiles
      # (project.yml sets CODE_SIGN_STYLE Manual for Release only).
      - name: App Store provisioning profiles (manual signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The serial of the distribution certificate imported above — the
          # profiles must name exactly the certificate CI signs with.
          serial=$(security find-certificate -c "Apple Distribution" -p "$RUNNER_TEMP/signing.keychain-db" \
            | openssl x509 -noout -serial | cut -d= -f2)
          echo "distribution certificate serial: $serial"
          out="$RUNNER_TEMP/profiles"
          node tools/asc.mjs app-store-profiles "$serial" "$out" \
            "$BUNDLE_ID" "$BUNDLE_ID.widget" "$BUNDLE_ID.watchkitapp" "$BUNDLE_ID.watchkitapp.watchface"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$out"/*.mobileprovision "$dir/"
          done

      - name: Archive
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail -o pipefail
          xcodebuild archive \
            -project StudentAthlete.xcodeproj \
            -scheme StudentAthlete \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudentAthlete.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -60

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>SA AppStore ${BUNDLE_ID}</string>
              <key>${BUNDLE_ID}.widget</key><string>SA AppStore ${BUNDLE_ID}.widget</string>
              <key>${BUNDLE_ID}.watchkitapp</key><string>SA AppStore ${BUNDLE_ID}.watchkitapp</string>
              <key>${BUNDLE_ID}.watchkitapp.watchface</key><string>SA AppStore ${BUNDLE_ID}.watchkitapp.watchface</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudentAthlete.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tail -40
          ls -la "$RUNNER_TEMP/export"

      # ── The evidence §19 insists on ───────────────────────────────────────
      - name: 'Evidence: signed entitlements of the app and every nested bundle'
        run: |
          set -uo pipefail
          archive="$RUNNER_TEMP/StudentAthlete.xcarchive"
          app="$archive/Products/Applications/Student Athlete.app"
          echo "### Signed entitlements" >> "$GITHUB_STEP_SUMMARY"
          # -d find: every bundle inside the archive, not just the top-level app.
          while IFS= read -r bundle; do
            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "  $(basename "$bundle")"
            echo "═══════════════════════════════════════════════════════════"
            codesign -d --entitlements :- --xml "$bundle" 2>/dev/null \
              | plutil -convert xml1 -o - - || echo "  (no entitlements)"
            echo ""
            echo "  --- identity ---"
            codesign -dvvv "$bundle" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier=' || true
          done < <(find "$app" -name '*.app' -o -name '*.appex' | sort; echo "$app")

      - name: 'Evidence: DistributionSummary.plist'
        run: |
          summary=$(find "$RUNNER_TEMP/export" -name 'DistributionSummary.plist' | head -1)
          if [ -n "$summary" ]; then
            plutil -p "$summary"
          else
            echo '::warning::no DistributionSummary.plist was produced'
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo '::error::no IPA was exported'; exit 1; }
          echo "uploading $(basename "$ipa") ($(du -h "$ipa" | cut -f1))"
          # altool reads the key from ~/private_keys, ./private_keys or
          # ASC_API_KEY-adjacent paths; the copy is what makes it findable.
          mkdir -p ~/private_keys
          cp "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" ~/private_keys/
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee "$RUNNER_TEMP/upload.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### TestFlight upload"
            echo ""
            echo "- Notes: ${{ inputs.notes || 'Scheduled daily safety-net build — whatever was on master at 06:00 UTC.' }}"
            echo "- Build number: \`$BUILD_NUMBER\`"
            echo "- Bundle: \`$BUNDLE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-evidence
          path: |
            ${{ runner.temp }}/export
            ${{ runner.temp }}/upload.json
          if-no-files-found: warn

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/private_keys "$RUNNER_TEMP/private_keys" || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
