name: check

# §19: every iOS action is dispatchable, and every run prints evidence rather
# than a bare pass/fail. The push trigger is added because macOS minutes are
# free on a public repository — remove it if this repo is ever made private.
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/check.yml'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  linux-checks:
    name: Linux checks (§21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm test

      # No working-directory: it is resolved before the script runs, so a missing
      # content/ would fail the step rather than reach the guard inside it.
      - name: Content catalogue integrity and codegen (§21)
        run: |
          if [ ! -f content/package.json ]; then
            echo "content/ has no package.json yet — M1 has not landed."
            exit 0
          fi
          cd content
          npm ci
          npm test
          npm run build

  ios-checks:
    name: Xcode build and evidence
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate content (codegen feeds Shared/Sources/Generated)
        run: |
          if [ -f content/package.json ]; then
            cd content && npm ci && npm run build
          else
            echo "content/ not present yet — M1 has not landed."
          fi

      - name: XcodeGen
        working-directory: app
        run: xcodegen generate --spec project.yml

      # ── Evidence, not pass/fail (§19) ─────────────────────────────────────
      # These three checks each correspond to a trap that has shipped a broken
      # build before. They fail the job, loudly, rather than being discovered in
      # TestFlight.

      - name: 'Evidence: CODE_SIGN_ENTITLEMENTS is set on every target'
        working-directory: app
        run: |
          fail=0
          for target in StudentAthlete StudentAthleteWidget StudentAthleteWatch StudentAthleteWatchWidget; do
            value=$(xcodebuild -project StudentAthlete.xcodeproj -target "$target" \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '/ CODE_SIGN_ENTITLEMENTS = /{print $2; exit}')
            printf '%-28s CODE_SIGN_ENTITLEMENTS = %s\n' "$target" "${value:-<UNSET>}"
            if [ -z "$value" ]; then
              echo "::error::$target has no CODE_SIGN_ENTITLEMENTS. An entitlements: block does not set it (§19); the file would be generated and never applied."
              fail=1
            fi
          done
          exit $fail

      - name: 'Evidence: entitlements files are not the empty 181-byte plist'
        working-directory: app
        run: |
          fail=0
          for f in */*.entitlements; do
            size=$(wc -c < "$f" | tr -d ' ')
            keys=$(/usr/libexec/PlistBuddy -c Print "$f" | grep -c '=' || true)
            printf '%-64s %6s bytes, %s keys\n' "$f" "$size" "$keys"
            if [ "$keys" -eq 0 ]; then
              echo "::error::$f has no entitlement keys. XcodeGen overwrites a path-only entitlements block with an empty plist on every generate (§19)."
              fail=1
            fi
          done
          echo '--- contents ---'
          for f in */*.entitlements; do echo "== $f"; cat "$f"; done
          exit $fail

      - name: 'Evidence: watchOS targets carry TARGETED_DEVICE_FAMILY 4'
        working-directory: app
        run: |
          fail=0
          for target in StudentAthleteWatch StudentAthleteWatchWidget; do
            value=$(xcodebuild -project StudentAthlete.xcodeproj -target "$target" \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '/ TARGETED_DEVICE_FAMILY = /{print $2; exit}')
            printf '%-28s TARGETED_DEVICE_FAMILY = %s\n' "$target" "${value:-<UNSET>}"
            if [ "$value" != "4" ]; then
              echo "::error::$target has TARGETED_DEVICE_FAMILY=${value:-<UNSET>}, not 4. A watch binary claiming iPhone is rejected under 2.3 (§19)."
              fail=1
            fi
          done
          exit $fail

      # ── Unsigned builds ───────────────────────────────────────────────────

      - name: Build iPhone app (unsigned, simulator)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudentAthlete.xcodeproj \
            -scheme StudentAthlete \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -200

      - name: 'Run iOS unit tests (§21: age gate, model cascade rules, API decoding, offline pack behaviour)'
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test \
            -project StudentAthlete.xcodeproj \
            -scheme StudentAthlete \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -150

      - name: Build Watch app (unsigned, simulator)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudentAthlete.xcodeproj \
            -scheme StudentAthleteWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -200

      # A hand-written Info.plist that omits CFBundleIdentifier (or the other
      # three boilerplate keys Xcode's default template always carries) builds
      # cleanly but produces an app simctl/a real device refuses to install:
      # "Missing bundle ID" — indistinguishable from a signing problem until you
      # look at the built Info.plist directly. This caught exactly that bug once
      # already, so it stays as a permanent guard.
      - name: 'Evidence: every built app has a resolved CFBundleIdentifier'
        run: |
          fail=0
          for pair in \
            'Student Athlete.app:Debug-iphonesimulator:com.studentathlete.app' \
            'Student Athlete.app:Debug-watchsimulator:com.studentathlete.app.watchkitapp'
          do
            name="${pair%%:*}"; rest="${pair#*:}"; config="${rest%%:*}"; expected="${rest##*:}"
            path=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "$name" -path "*${config}*" | head -1)
            if [ -z "$path" ]; then
              echo "::error::no built app matching $name under $config was found"
              fail=1
              continue
            fi
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$path/Info.plist" 2>/dev/null || echo '<MISSING>')
            printf '%-40s CFBundleIdentifier = %s\n' "$path" "$actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$path has CFBundleIdentifier=$actual, expected $expected. A source Info.plist missing the CFBundleIdentifier/CFBundleName/CFBundleExecutable/CFBundlePackageType boilerplate builds fine but cannot be installed."
              fail=1
            fi
          done
          exit $fail

      # Removed the simulator-screenshot step: it was pure evidence-gathering
      # (never gated pass/fail) and had become the slowest, most flake-prone
      # step in this workflow — it hung for 11+ minutes once and 3-4 minutes
      # routinely, on a simulator boot/install/launch sequence unrelated to
      # code correctness. Real visual verification now happens on-device via
      # actual TestFlight builds, which is strictly better evidence than an
      # unsigned simulator screenshot anyway.
