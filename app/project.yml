# XcodeGen source of truth. The .xcodeproj is generated and never committed (§19).
#
# Three traps from §19 are handled deliberately here; do not "tidy" them away:
#   1. An `entitlements:` block does NOT set CODE_SIGN_ENTITLEMENTS. It is set
#      explicitly in every target's settings.base, or the file is generated and
#      then never applied — HealthKit, App Groups and Sign in with Apple all
#      silently absent from the signed app.
#   2. An `entitlements:` block with only a `path` and no `properties` makes
#      XcodeGen overwrite that file with an empty 181-byte plist on every
#      generate. Every entitlements block below declares `properties`.
#   3. watchOS targets need TARGETED_DEVICE_FAMILY "4". Inheriting the
#      project-wide "1,2" ships a watch binary claiming iPhone, which App Review
#      rejects under 2.3.

name: StudentAthlete

options:
  bundleIdPrefix: com.studentathlete.app
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

# One place for the identifiers. §23 records these as changeable constants.
attributes:
  ORGANIZATIONNAME: Sportvisor

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    # Never force CODE_SIGN_IDENTITY — Xcode refuses it as "conflicting
    # provisioning settings" under automatic signing (§19).
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

configs:
  Debug: debug
  Release: release

targets:

  # ─────────────────────────────────────────────────────────── iPhone app
  StudentAthlete:
    type: application
    platform: iOS
    sources:
      - path: StudentAthlete/Sources
      - path: Shared/Sources
      - path: StudentAthlete/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentathlete.app
        PRODUCT_NAME: Sportvisor
        INFOPLIST_FILE: StudentAthlete/Info.plist
        # Trap 1: must be stated explicitly.
        CODE_SIGN_ENTITLEMENTS: StudentAthlete/StudentAthlete.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      # Release (TestFlight/App Store) signs manually with the imported
      # distribution certificate and an App Store profile the testflight
      # workflow creates via the API — automatic signing minted a new
      # development certificate on every CI runner until Apple's limit hit.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "SA AppStore com.studentathlete.app"
    entitlements:
      path: StudentAthlete/StudentAthlete.entitlements
      # Trap 2: properties must be present or this file is blanked on generate.
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.studentathlete.app
        aps-environment: production
    dependencies:
      - target: StudentAthleteWatch
        embed: true
      - target: StudentAthleteWidget
        embed: true

  # ─────────────────────────────────────────────────────────── iOS widget
  StudentAthleteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StudentAthleteWidget/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentathlete.app.widget
        # Shared/Sources compiles into this extension too; APP_EXTENSION
        # fences off the few app-only APIs (UIApplication.shared).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_EXTENSION"
        PRODUCT_NAME: Sportvisor Widget
        INFOPLIST_FILE: StudentAthleteWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudentAthleteWidget/StudentAthleteWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      # Release (TestFlight/App Store) signs manually with the imported
      # distribution certificate and an App Store profile the testflight
      # workflow creates via the API — automatic signing minted a new
      # development certificate on every CI runner until Apple's limit hit.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "SA AppStore com.studentathlete.app.widget"
    entitlements:
      path: StudentAthleteWidget/StudentAthleteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.studentathlete.app

  # ─────────────────────────────────────────────────────────── Watch app
  StudentAthleteWatch:
    type: application
    platform: watchOS
    sources:
      - path: StudentAthleteWatch/Sources
      - path: Shared/Sources
      - path: StudentAthleteWatch/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentathlete.app.watchkitapp
        PRODUCT_NAME: Sportvisor
        INFOPLIST_FILE: StudentAthleteWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudentAthleteWatch/StudentAthleteWatch.entitlements
        # Trap 3: "4" is watchOS. Inheriting "1,2" is a 2.3 rejection.
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
      # Release (TestFlight/App Store) signs manually with the imported
      # distribution certificate and an App Store profile the testflight
      # workflow creates via the API — automatic signing minted a new
      # development certificate on every CI runner until Apple's limit hit.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "SA AppStore com.studentathlete.app.watchkitapp"
    entitlements:
      path: StudentAthleteWatch/StudentAthleteWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.studentathlete.app
    dependencies:
      - target: StudentAthleteWatchWidget
        embed: true

  # ─────────────────────────────────────────────────── iOS unit tests (§21)
  # Standalone/library-based (no TEST_HOST) — Shared/Sources is compiled into
  # this target the same way it is compiled into the other four, so the
  # tests reference APIClient/AthleteModels/etc. directly with no @testable
  # import and no dependency on the host app being built first.
  StudentAthleteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudentAthleteTests/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentathlete.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # ────────────────────────────────────── Watch complication (WidgetKit)
  StudentAthleteWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: StudentAthleteWatchWidget/Sources
      - path: Shared/Sources
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_EXTENSION"
        # "complication" is a reserved substring Apple's bundle-id registration
        # rejects outright (409 "is not available", confirmed by trying it) --
        # not a real collision, just a blocked keyword. Named for what it is
        # anyway: this extension is the watch face complication.
        PRODUCT_BUNDLE_IDENTIFIER: com.studentathlete.app.watchkitapp.watchface
        PRODUCT_NAME: Sportvisor Complication
        INFOPLIST_FILE: StudentAthleteWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudentAthleteWatchWidget/StudentAthleteWatchWidget.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
      # Release (TestFlight/App Store) signs manually with the imported
      # distribution certificate and an App Store profile the testflight
      # workflow creates via the API — automatic signing minted a new
      # development certificate on every CI runner until Apple's limit hit.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "SA AppStore com.studentathlete.app.watchkitapp.watchface"
    entitlements:
      path: StudentAthleteWatchWidget/StudentAthleteWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.studentathlete.app

schemes:
  StudentAthlete:
    build:
      targets:
        StudentAthlete: all
        StudentAthleteTests: [test]
    test:
      targets:
        - StudentAthleteTests
    run:
      config: Debug
    archive:
      config: Release
  StudentAthleteWatch:
    build:
      targets:
        StudentAthleteWatch: all
    run:
      config: Debug
