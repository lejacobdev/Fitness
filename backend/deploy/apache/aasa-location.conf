# Snippet added inside the EXISTING /etc/apache2/sites-available/api.lejacob.dev.conf
# :443 vhost (shared with the Hunting Game backend, which owns "/"), right
# after the <Location "/fitness"> block and before the catch-all ProxyPass /.
#
# Apple reads https://api.lejacob.dev/.well-known/apple-app-site-association
# (domain root, no redirects, JSON) to let links like
# https://api.lejacob.dev/fitness/team/ABC234 open the AthleteOS app. Only
# this one exact path goes to the fitness backend (src/routes/links.js); it
# was a 404 on the Hunting Game backend before. If that app ever needs its
# own universal links, add its app ID to APPLE_APP_IDS in backend/.env
# (comma-separated) instead of adding a second file.
#
# Apply with `apache2ctl configtest && systemctl restart apache2` (restart,
# not reload — see fitness-location.conf).
#
#   <Location "/.well-known/apple-app-site-association">
#       ProxyPass "http://127.0.0.1:8421/.well-known/apple-app-site-association"
#       ProxyPassReverse "http://127.0.0.1:8421/.well-known/apple-app-site-association"
#   </Location>
