# Snippet manually added inside the EXISTING /etc/apache2/sites-available/
# api.lejacob.dev.conf vhost (both :80 and :443 blocks share IP-allowlist
# access control already; only the :443 block needs this ProxyPass — the :80
# block is an unconditional HTTPS redirect and never reaches here).
#
# That vhost is SHARED with the "Hunting Game" (manhunt) backend, which owns
# the catch-all "/" -> 127.0.0.1:8420. This app is path-routed under the same
# domain/certificate instead of getting its own subdomain. Insert the block
# below into the :443 VirtualHost, BEFORE the existing catch-all
# `ProxyPass / http://127.0.0.1:8420/` — Apache matches Location blocks by
# specificity, but keeping the more specific one first avoids any ambiguity.
#
# The trailing-slash choice here is deliberate and was the actual bug the
# first version of this shipped with: `ProxyPass "http://127.0.0.1:8421/"`
# (WITH a trailing slash) inside `<Location "/fitness">` produces a doubled
# leading slash on the forwarded request -- `GET /fitness/health` became
# `GET //health` at the backend, which Express does not normalise, so every
# route 404'd even though the proxy itself was "working." Confirmed by hand
# with a raw socket listener in place of the real container. NO trailing
# slash on the ProxyPass target is correct here.
#
# Apply with restart, not reload -- `systemctl reload apache2` is broken on
# this box (a systemd private-tmp/mount-namespace issue unrelated to this
# app's config; confirmed it already failed once on its own, from a
# presumably-scheduled reload, before this file ever existed). `apache2ctl
# graceful` hit the same underlying issue and briefly took Apache down
# entirely. `systemctl restart apache2` is the reliable path on this host.
#
#   <Location "/fitness">
#       ProxyPass "http://127.0.0.1:8421"
#       ProxyPassReverse "http://127.0.0.1:8421"
#   </Location>
#
# backend/.env on the host (gitignored, never committed) sets API_PORT=8421
# to match. Redeploy with:
#   cd backend && docker compose up -d --build
